// build-tag: 3 — media search, Spotify collections and MP3 export
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ytdl'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.ytdl'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Maintained FFmpegKit fork. Used only for real MP3 encoding + ID3 metadata/cover art.
    // Same com.arthenica.ffmpegkit API as the retired upstream package.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
