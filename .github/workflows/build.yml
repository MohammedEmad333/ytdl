name: Build APK

# No branch filter — GitHub's web editor commits straight to the default branch,
# whatever it happens to be called.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AGP 8.13 needs JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # setup-android's old default includes the removed SDK package named "tools".
      # Request only current packages explicitly so hosted-runner SDK changes don't break CI.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
